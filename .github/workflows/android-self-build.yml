name: Android Self Build

on:
    workflow_dispatch:
        inputs:
            version_name:
                description: 'APK versionName, e.g. 0.35.1-xingpingcn.1'
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: android-self-build
    cancel-in-progress: false

jobs:
    build:
        # The signing secrets must only run against the protected default branch.
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: android
        env:
            HAPI_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.HAPI_SELF_BUILD_KEYSTORE_PASSWORD }}
            HAPI_UPLOAD_KEY_ALIAS: ${{ secrets.HAPI_SELF_BUILD_KEY_ALIAS }}
            HAPI_UPLOAD_KEY_PASSWORD: ${{ secrets.HAPI_SELF_BUILD_KEY_PASSWORD }}
            HAPI_VERSION_NAME: ${{ inputs.version_name }}
        steps:
            - uses: actions/checkout@v4
              with:
                  # The Android versionCode is the reachable commit count.
                  fetch-depth: 0
            - name: Derive APK versionCode
              id: version
              run: printf 'code=%s\n' "$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
            - uses: gradle/actions/setup-gradle@v4
            - name: Install self-build signing key
              env:
                  KEYSTORE_BASE64: ${{ secrets.HAPI_SELF_BUILD_KEYSTORE_BASE64 }}
              run: |
                  set -euo pipefail
                  test -n "$KEYSTORE_BASE64"
                  test -n "$HAPI_UPLOAD_KEYSTORE_PASSWORD"
                  test -n "$HAPI_UPLOAD_KEY_ALIAS"
                  test -n "$HAPI_UPLOAD_KEY_PASSWORD"
                  umask 077
                  keystore="$RUNNER_TEMP/hapi-self-build.keystore"
                  printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
                  test -s "$keystore"
                  printf 'HAPI_UPLOAD_KEYSTORE=%s\n' "$keystore" >> "$GITHUB_ENV"
            - name: Test and build signed Release APK
              run: |
                  ./gradlew \
                      -PhapiVersionName="$HAPI_VERSION_NAME" \
                      :core:protocol:test :core:data:testDebugUnitTest :app:testDebugUnitTest \
                      :app:assembleRelease :app:lintRelease
            - name: Verify APK signature and write checksums
              id: apk
              run: |
                  set -euo pipefail
                  apk='app/build/outputs/apk/release/app-release.apk'
                  test -s "$apk"
                  apksigner="$(find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
                  test -n "$apksigner"
                  "$apksigner" verify --verbose --print-certs "$apk" > app/build/outputs/apk/release/signing-certificate.txt
                  sha256sum "$apk" > app/build/outputs/apk/release/app-release.apk.sha256
                  {
                      printf 'versionName=%s\n' "$HAPI_VERSION_NAME"
                      printf 'versionCode=%s\n' '${{ steps.version.outputs.code }}'
                      printf 'commit=%s\n' "$GITHUB_SHA"
                  } > app/build/outputs/apk/release/build-info.txt
                  printf 'apk=%s\n' "$apk" >> "$GITHUB_OUTPUT"
            - uses: actions/upload-artifact@v4
              with:
                  name: hapi-android-${{ steps.version.outputs.code }}-${{ github.sha }}
                  if-no-files-found: error
                  retention-days: 90
                  path: |
                      android/app/build/outputs/apk/release/app-release.apk
                      android/app/build/outputs/apk/release/app-release.apk.sha256
                      android/app/build/outputs/apk/release/signing-certificate.txt
                      android/app/build/outputs/apk/release/build-info.txt
            - name: Remove signing key
              if: always()
              run: rm -f "$RUNNER_TEMP/hapi-self-build.keystore"
